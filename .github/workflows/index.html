<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAVOUR MUSIC Player</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>
        <h1><i class="fa-solid fa-headphones"></i> FAVOUR MUSIC PLAYER</h1>

        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search songs...">
        </div>
    </header>


    <!-- PLAYER -->
    <main>

        <section class="player">

            <div class="cover-container">
                <img id="cover"
                     src="https://images.unsplash.com/photo-1511379938547-c1f69419868d"
                     alt="Album Cover">
            </div>

            <h2 id="songTitle">My First Song</h2>
            <p id="artist">Unknown Artist</p>

            <audio id="audio"></audio>

            <!-- PROGRESS -->
            <div class="progress-area">
                <span id="currentTime">0:00</span>

                <input type="range"
                       id="progress"
                       value="0"
                       min="0"
                       max="100">

                <span id="duration">0:00</span>
            </div>


            <!-- CONTROLS -->
            <div class="controls">

                <button id="shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>

                <button id="previous">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button id="play">
                    <i class="fa-solid fa-play"></i>
                </button>

                <button id="next">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <button id="repeat">
                    <i class="fa-solid fa-repeat"></i>
                </button>

            </div>


            <!-- VOLUME -->
            <div class="volume">

                <i class="fa-solid fa-volume-low"></i>

                <input type="range"
                       id="volume"
                       min="0"
                       max="1"
                       step="0.01"
                       value="1">

                <i class="fa-solid fa-volume-high"></i>

            </div>

        </section>


        <!-- SONG LIST -->
        <section class="playlist">

            <h2>My Playlist</h2>

            <div id="songList"></div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
